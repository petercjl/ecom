name: Publish verified Ecom Windows payload
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact verified Windows native version
        required: true
        type: string
      tag:
        description: npm channel
        default: latest
        type: choice
        options: [next, latest]
      payload_url:
        description: Temporary HTTPS transfer URL (first publication only)
        required: false
        type: string
      validate_only:
        description: Validate without publication
        default: true
        type: boolean
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: ecom-windows-payload-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ${{ inputs.release }}
      DIST_TAG: ${{ inputs.tag }}
      PAYLOAD_URL: ${{ inputs.payload_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - name: Validate committed Windows evidence
        run: node ecom/verify-windows-payload.mjs "$RELEASE" --tag "$DIST_TAG"
      - name: Fetch and verify pinned Windows payload parts
        run: node ecom/windows-release-transfer.mjs fetch "$RELEASE" "$DIST_TAG"
      - name: Hold temporary Actions transfer artifact
        id: transfer
        uses: actions/upload-artifact@v4
        with:
          name: ecom-windows-verified-payload
          path: windows-payloads
          retention-days: 1
          compression-level: 0
      - name: Publish or promote identical verified Windows payload through OIDC
        if: ${{ !inputs.validate_only }}
        run: node ecom/windows-release-transfer.mjs publish "$RELEASE" "$DIST_TAG"
      - name: Delete temporary binary transfer artifact
        if: ${{ always() && steps.transfer.outputs.artifact-id != '' }}
        env:
          ARTIFACT_ID: ${{ steps.transfer.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
