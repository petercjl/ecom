name: Publish verified Ecom macOS payload
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact verified native version
        required: true
        type: string
      tag:
        description: npm channel
        required: true
        default: latest
        type: choice
        options: [next, latest]
      validate_only:
        description: Validate without publication
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: ecom-macos-payload-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ inputs.release }}
      DIST_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with Trusted Publishing support
        run: npm install --global npm@11.21.0
      - name: Validate committed native evidence before downloading
        run: node ecom/verify-release-payload.mjs "$RELEASE" --tag "$DIST_TAG"
      - name: Download immutable native payload
        run: |
          mkdir payload-download
          gh release download "ecom-macos-v$RELEASE" --pattern "petercjl-ecom-macos-arm64-$RELEASE.tgz" --dir payload-download
      - name: Verify native payload identity and checksums
        run: node ecom/verify-release-payload.mjs "$RELEASE" "payload-download/petercjl-ecom-macos-arm64-$RELEASE.tgz" --tag "$DIST_TAG"
      - name: Verify registry identity before publication or promotion
        id: registry
        run: node ecom/registry-payload-status.mjs "$RELEASE" "payload-download/petercjl-ecom-macos-arm64-$RELEASE.tgz" "$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Publish the exact prebuilt payload through OIDC
        if: ${{ !inputs.validate_only && steps.registry.outputs.exists == 'false' }}
        working-directory: ${{ runner.temp }}
        run: npm publish "$GITHUB_WORKSPACE/payload-download/petercjl-ecom-macos-arm64-$RELEASE.tgz" --access public --tag "$DIST_TAG"
      - name: Promote the byte-identical verified version through OIDC
        if: ${{ !inputs.validate_only && steps.registry.outputs.exists == 'true' }}
        working-directory: ${{ runner.temp }}
        run: npm dist-tag add "@petercjl/ecom-macos-arm64@$RELEASE" "$DIST_TAG"
