name: Ecom source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node ecom/verify-source.mjs
      - run: node --test ecom/tests/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -B -m unittest script.lib.l10n.ecom_branding_test
