<main id="routing-view" class="routing-view" hidden>
  <header class="page-header"><div><div class="eyebrow">ECOM WORKSPACE</div><h1 id="routing-title"></h1><p id="routing-intro"></p></div><button id="routing-add" class="primary"></button></header>
  <section class="toolbar"><label><input id="routing-global" type="checkbox"><span id="routing-global-label"></span></label><button id="routing-refresh"></button></section>
  <p id="routing-message" role="status" aria-live="polite"></p>
  <section id="routing-rules" aria-label="URL rules"></section>
  <section class="card"><h2 id="routing-test-title"></h2><form id="routing-test-form"><label for="routing-test-url" id="routing-test-label"></label><div class="inline"><input id="routing-test-url" type="url" required placeholder="https://item.taobao.com/item.htm?id=123"><button id="routing-test-submit" class="primary"></button></div></form><p id="routing-test-help"></p><div id="routing-test-result" aria-live="polite"></div></section>
  <dialog id="routing-editor"><form id="routing-edit-form">
    <h2 id="routing-edit-title"></h2><label for="routing-rule-name" id="routing-name-label"></label><input id="routing-rule-name" maxlength="100" required>
    <label for="routing-target" id="routing-target-label"></label><select id="routing-target"></select><p id="routing-target-help"></p>
    <label><input type="checkbox" id="routing-rule-enabled"><span id="routing-enabled-label"></span></label>
    <h3 id="routing-conditions-title"></h3><p id="routing-conditions-help"></p><div id="routing-conditions"></div><button id="routing-condition-add" type="button"></button>
    <details><summary id="routing-bulk-label"></summary><textarea id="routing-bulk" rows="4" placeholder="https://example.com/a&#10;https://example.com/b"></textarea><button id="routing-bulk-add" type="button"></button></details>
    <p id="routing-edit-error" role="alert"></p><footer><button id="routing-cancel" type="button"></button><button class="primary" id="routing-save" type="submit"></button></footer>
  </form></dialog>
</main>
